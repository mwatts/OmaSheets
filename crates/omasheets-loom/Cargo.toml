[package]
name = "omasheets-loom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "OmaSheets spreadsheet as a Loom native composite (omasheets.Spreadsheet)"

[dependencies]
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit = { path = "../../../loom/vendor/gpui-kit/crates/kit" }
gpui-shell = { path = "../../../loom/vendor/gpui-kit/crates/shell" }
loom-gpui = { path = "../../../loom/crates/loom-gpui" }
omasheets-gpui = { path = "../omasheets-gpui" }
serde_json = "1"

[dev-dependencies]
gpui-kit = { path = "../../../loom/vendor/gpui-kit/crates/kit", features = ["test-support"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

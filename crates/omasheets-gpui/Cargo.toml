[package]
name = "omasheets-gpui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The sibling checkout ../gpui-kit, the kit Ashlar pins.
gpui-kit = { path = "../../../gpui-kit/crates/kit" }
omasheets-calc = { path = "../omasheets-calc" }
omasheets-core = { path = "../omasheets-core" }
omasheets-store = { path = "../omasheets-store" }
omasheets-xlsx = { path = "../omasheets-xlsx" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui-kit = { path = "../../../gpui-kit/crates/kit", features = ["test-support"] }
omasheets-core = { path = "../omasheets-core" }

[workspace]
members = [
  "crates/omasheets-calc",
  "crates/omasheets-core",
  "crates/omasheets-corpus",
  "crates/omasheets-gpui",
  "crates/omasheets-loom",
  "crates/omasheets-service",
  "crates/omasheets-store",
  "crates/omasheets-xlsx",
]
exclude = ["spikes/fastcore", "spikes/qt-grid"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

# Same facade as Loom/Ashlar: shell names crates.io `rquickjs`.
[patch.crates-io]
rquickjs = { path = "../loom/vendor/gpui-kit/crates/shell/rquickjs-compat" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
